# Keep the Render free-tier signal hub from sleeping.
# Render spins down after ~15m idle; this pings /health every 10 minutes.
#
# Note: GitHub scheduled Actions can occasionally delay. For stricter uptime,
# also add a free UptimeRobot HTTP(S) monitor on the same /health URL (every 5 min).
# True always-on requires a paid Render instance.

name: Keep Render hub awake

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake signal hub
        env:
          HUB_HEALTH_URL: https://sbarg-nuketown-hub.onrender.com/health
        run: |
          set -e
          echo "Pinging $HUB_HEALTH_URL ..."
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 45 "$HUB_HEALTH_URL"; then
              echo ""
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 8s..."
            sleep 8
          done
          echo "Hub did not respond after retries"
          exit 1
